[project]
name = "template-typescript"
version = "0.0.0"
description = "template-typescript (Copier): this file only drives the template's own tests"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "copier>=9.19,<10",
    # <9.2: pytest 9.2 ignores the nodeid xdist 3.8 rewrites, so --dist loadgroup stops grouping
    # (pytest-dev/pytest-xdist#1386, fixed after 3.8.0). Lift it with an xdist release that has the fix.
    "pytest>=8.3,<9.2",
    "pytest-xdist>=3.6",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker' --dist loadgroup"
# A passing test's tmp_path goes when it ends; only the last run's failures are kept.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = ["docker: runs checks through Docker (uv run pytest -m docker)"]

[tool.ruff]
line-length = 120
extend-exclude = ["template", "includes"]
